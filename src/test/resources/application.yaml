spring:
  datasource:
    url: jdbc:h2:mem:jinjuwiki;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  mail:
    host: localhost
    port: 2525

jwt:
  secret: jinjuwiki-jwt-secret-key-for-test-environment-2026
  access-token-expiration: 3600000

app:
  security:
    swagger-public-enabled: true
    cors:
      allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  auth:
    email-verification-expiration-minutes: 5
  upload:
    image-path: /tmp/jinjuwiki-test-uploads/images
    image-url-prefix: /uploads/images/
