spring:
  docker:
    compose:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/jinjuwiki
    username: jinjuwiki
    password: jinjuwiki
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:jinjuwiki-jwt-secret-key-for-local-development-2026}
  access-token-expiration: 3600000

app:
  auth:
    email-verification-expiration-minutes: 5
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@jinjuwiki.local}}
