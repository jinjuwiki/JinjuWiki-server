spring:
  application:
    name: JinjuWiki
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jinjuwiki}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jpa:
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    swagger-public-enabled: true
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.app,https://*.ngrok.io}
  auth:
    email-verification-expiration-minutes: 5
    email-verification-send-rate-limit:
      count: 3
      window-seconds: 60
    email-verification-verify-attempt-limit:
      count: 5
      window-seconds: 300
    login-attempt-limit:
      count: 5
      window-seconds: 300
    password-reset-request-rate-limit:
      count: 5
      window-seconds: 300
    password-reset-verify-attempt-limit:
      count: 5
      window-seconds: 300
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@jinjuwiki.local}}
  search:
    view-count-flush-enabled: true
    view-count-flush-delay-millis: 60000
  upload:
    image-path: uploads/images
    image-url-prefix: /uploads/images/
