services:
  postgres:
    image: postgres:16
    container_name: jinjuwiki-postgres
    environment:
      POSTGRES_DB: jinjuwiki
      POSTGRES_USER: jinjuwiki
      POSTGRES_PASSWORD: jinjuwiki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jinjuwiki -d jinjuwiki"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
